<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmed — FightBase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #09090D; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .icon { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,0,0,0.12); border: 1.5px solid rgba(255,0,0,0.3); margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 32px; }
    .logo { font-family: Arial Black, sans-serif; font-size: 18px; font-weight: 900; color: #FF0000; letter-spacing: 0.08em; margin-bottom: 40px; display: block; }
    h1 { font-size: 28px; font-weight: 300; margin-bottom: 12px; letter-spacing: -0.5px; }
    p { color: rgba(255,255,255,0.55); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
    .btn { display: inline-block; background: #FF0000; color: #fff; padding: 14px 36px; border-radius: 50px; text-decoration: none; font-size: 15px; font-weight: 500; }
    .footer { margin-top: 48px; color: rgba(255,255,255,0.2); font-size: 11px; }
  </style>
</head>
<body>
  <div class="container">
    <span class="logo">FIGHTBASE</span>
    <div class="icon">✓</div>
    <h1>Booking Confirmed</h1>
    <p>Your payment was successful. Return to the FightBase app to view your booking details.</p>
    <a href="thefightbase://" class="btn">Open FightBase App</a>
    <p class="footer">Your Base. Your Fight. — fightbaseapp.com</p>
  </div>
</body>
</html>
